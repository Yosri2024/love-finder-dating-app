spring.application.name=datingbackend

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/datingdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Email Configuration (override via env vars in prod)
# Gmail: host=smtp.gmail.com port=587 + an App Password (Google account -> 2FA -> App password)
# Brevo: host=smtp-relay.brevo.com port=587 + your Brevo SMTP login/key
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Server Port
server.port=8081

# JWT (override via env var - REQUIRED in prod, min 32 chars)
app.jwt.secret=${APP_JWT_SECRET:change-me-use-env-var-min-32-chars}
app.jwt.expiration-ms=86400000

# DEV ONLY: read login/verify codes without email (debug-code endpoint).
# Enabled by default locally. DISABLE IN PROD: APP_DEBUG_CODES=false
app.debug-codes=${APP_DEBUG_CODES:true}

# CORS: comma-separated origin PATTERNS (supports *). Covers web dev + Capacitor APK
# (Android WebView origin = http://localhost, iOS = capacitor://localhost).
# In prod, set APP_CORS_PATTERNS=https://ton-domaine.com
app.cors-patterns=${APP_CORS_PATTERNS:http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*,capacitor://*,ionic://*}
